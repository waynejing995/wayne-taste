# Example only. Your rules live in ~/.wayne/inbox/rules.yaml (copy this there and edit; it is never overwritten).
# source -> place -> rules, top to bottom, first match wins.
# place = one chat / one repo / one mail folder / one named JQL. A place not listed is not recorded.
# when:   exact field values (a list = any of them; "!x" = anything but x). Empty `when` matches everything.
# action: do (an agent acts) | notify (tell you) | log (record only) | ignore (not recorded)
# owner:  optional default handler written into the ledger row.

github: # fields: number (PR number), event (review | check | merged), state, actor (reviewer login, or auto-review; review only), verdict (clean | critical) and commit (auto-review only)
  example-org/example-repo:
    - when: { number: ["101", "102"], event: review, actor: auto-review } # multi-source auto-review: start a turn
      tag: auto-review
      action: do
      owner: example-owner
    - when: { event: review, actor: [your-github-login, auto-review] }
      action: ignore
    - when: { number: ["101", "102"], event: review }
      tag: pr-review
      action: notify
    - when: { number: ["101", "102"], event: check, state: [FAILURE, TIMED_OUT, CANCELLED] }
      tag: ci-failed
      action: notify
    - when: { number: ["101", "102"], event: merged }
      tag: pr-merged
      action: log
    - action: ignore

outlook: # fields: from, flagged (yes | no)
  Inbox:
    - when: { flagged: "yes" } # quoted: a bare yes is a YAML boolean, and inbox.py refuses it
      tag: mail-flagged
      action: notify
    - action: ignore

agents: # fields: event (result | idle | ask | ended | dead | gone | stalled | blocked), state, mux, host. Place = session name; "*" = any session
  "*": # results, questions and deaths start a coordinator turn: verify or relay, then report where --goal says
    - when: { event: result }
      tag: agent-result
      action: do
      owner: coordinator
    - when: { event: idle }
      tag: agent-no-result
      action: do
      owner: coordinator
    - when: { event: ask } # pushed: the session waits on an `ask` or a tool approval; relay the question
      tag: agent-ask
      action: do
      owner: coordinator
    - when: { event: [ended, dead] } # pushed: omp exited, or no heartbeat (dead process)
      tag: agent-ended
      action: do
      owner: coordinator
    - when: { event: [gone, stalled, blocked] } # probed (sessions without push)
      tag: agent-trouble
      action: notify
